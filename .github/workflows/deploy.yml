name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_uiyhwFOtER5tOCCN7MOqC4Ni
          VERCEL_PROJECT_ID: prj_Fd4CFImfjnZl5Za6pOkvxtPNUfgF
